name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要挂到哪个 Release（如 v1.7.2，留空则只出 artifact）'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'mac/**'
      - '.github/workflows/build-macos.yml'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build app
        run: |
          cd mac
          bash build.sh

      - name: Inspect bundle
        run: |
          ls -la mac/build
          file mac/build/HoverTranslate.app/Contents/MacOS/HoverTranslate

      - name: Package
        run: |
          cd mac
          ditto -c -k --keepParent build/HoverTranslate.app HoverTranslate-macos.zip
          ls -lh HoverTranslate-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoverTranslate-macos
          path: mac/HoverTranslate-macos.zip
          retention-days: 30

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" mac/HoverTranslate-macos.zip \
            --clobber --repo "${{ github.repository }}"
