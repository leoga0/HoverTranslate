name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要挂到哪个 Release（如 v1.7.6，留空则只出 artifact）'
        required: false
        default: ''
  release:
    types: [published]
  push:
    branches: [ main ]
    paths:
      - 'mac/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: write   # 往 Release 挂 mac 包需要写权限

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build app
        run: |
          cd mac
          bash build.sh

      - name: Inspect bundle
        run: |
          ls -la mac/build
          file mac/build/HoverTranslate.app/Contents/MacOS/HoverTranslate

      - name: Package
        run: |
          cd mac
          ditto -c -k --keepParent build/HoverTranslate.app HoverTranslate-macos.zip
          ls -lh HoverTranslate-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoverTranslate-macos
          path: mac/HoverTranslate-macos.zip
          retention-days: 30

      # 三条触发路径统一：手动 dispatch 用输入，Release 发布用事件里的 tag。
      # 发布 Release 就自动补上 mac 包，不依赖谁记得手动跑一次。
      - name: Attach to release
        if: ${{ inputs.release_tag != '' || github.event.release.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          echo "上传到 Release: $TAG"
          gh release upload "$TAG" mac/HoverTranslate-macos.zip \
            --clobber --repo "${{ github.repository }}"
